plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenLocal()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

sourceSets {
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.datagen)
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        "${mod_id}Datagen" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }
    }
    runs {
        configureEach { loadedMods = [neoForge.mods."${mod_id}"] }
        data {
            type = "clientData"
            sourceSet = sourceSets.datagen
            loadedMods = [neoForge.mods."${mod_id}Datagen"]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    // Override with -Pchisel_jar=/absolute/path/to/a/26.3/chisel.jar for an unpublished build.
    if (providers.gradleProperty('chisel_jar').isPresent()) {
        implementation files(providers.gradleProperty('chisel_jar').get())
    } else {
        implementation "maven.modrinth:chisel-3:${chisel_version}"
    }
    implementation "maven.modrinth:ctmlib:${ctm_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure { useJUnitPlatform() }
tasks.named('check').configure { dependsOn tasks.named('datagenClasses') }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
        loader_version_range: loader_version_range, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, chisel_version_range: chisel_version_range]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { zip64 = true }
java { withSourcesJar() }
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}

// Enforce the source-set boundary in the artifact we actually ship.
var runtimeJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
var runtimeContents = zipTree(runtimeJarFile)
var datagenLeaks = runtimeContents.matching {
    include '**/datagen/**', '**/GatherDataEventHandler.class', '**/.cache/**'
}
var generatedBlockstates = runtimeContents.matching { include 'assets/chiselcompat/blockstates/*.json' }
var handwrittenJson = fileTree('src/main/resources').matching { include '**/*.json' }
var verifyRuntimeJar = tasks.register('verifyRuntimeJar') {
    dependsOn tasks.named('jar')
    inputs.file runtimeJarFile
    inputs.files handwrittenJson
    doLast {
        if (!datagenLeaks.empty) throw new GradleException("Datagen files leaked into the runtime jar: ${datagenLeaks.files}")
        if (!handwrittenJson.empty)
            throw new GradleException('Generate JSON into src/generated/resources instead of src/main/resources.')
        if (generatedBlockstates.empty)
            throw new GradleException('Generated resources are missing. Run runData before building.')
    }
}
tasks.named('check').configure { dependsOn verifyRuntimeJar }
